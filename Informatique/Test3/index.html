<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contrôle robot ROS2</title>
  <link rel="icon" href="https://ucaotech.com/wp-content/uploads/2024/10/UCAO-TECH-1.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <script src="js/roslib.min.js"></script>
  <style>
    /* Animation bouton direction */
    .controls button:active, .controls button.active-key {
      box-shadow: 0 0 16px #00f7ff, 0 2px 12px #00f7ff77;
      background: linear-gradient(135deg, #00f7ff 0%, #00d1ff 100%);
      color: #081a2b;
      transform: scale(1.13);
      transition: box-shadow 0.1s, background 0.1s, color 0.1s, transform 0.08s;
    }
    /* Animation apparition vidéo */
    .video-card, .video-container, #camera-view {
      animation: fadeInUp 0.7s cubic-bezier(.23,1.02,.47,.98);
    }
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    :root {
      --primary: #00f7ff;
      --secondary: #00d1ff;
      --bg-dark: #0a192f;
      --bg-header: rgba(2, 12, 27, 0.92);
      --text-main: #e6f1ff;
      --text-fade: #90caf9;
      --accent: #ff5252;
    }
    body {
      font-family: 'Roboto', Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      text-align: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    header {
      width: 100%;
      background: var(--bg-header);
      border-bottom: 1.5px solid var(--secondary);
      padding: 1.1rem 0 1.1rem 0;
      margin-bottom: 2.2rem;
      box-shadow: 0 2px 16px #00f7ff22;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 15px;
      color: white;
      text-decoration: none;
      font-family: 'Orbitron', Arial, sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1.5px;
    }
    .logo img {
      height: 44px;
      margin-right: 10px;
      transition: transform 0.5s ease;
    }
    .logo:hover img {
      transform: rotate(360deg);
    }
    h1 {
      color: var(--primary);
      font-family: 'Orbitron', Arial, sans-serif;
      font-size: 2.1rem;
      margin-bottom: 1.2rem;
      margin-top: 0.5rem;
      letter-spacing: 1.2px;
      text-shadow: 0 2px 16px #00f7ff33;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(90px, 1fr));
      gap: 14px;
      justify-content: center;
      margin: 30px auto 18px auto;
      max-width: 380px;
      background: #081a2b;
      border-radius: 18px;
      box-shadow: 0 4px 32px #00f7ff22;
      padding: 22px 18px 18px 18px;
      border: 2.5px solid var(--secondary);
    }
    button {
      padding: 15px;
      font-size: 1.25rem;
      background: linear-gradient(135deg, #00f7ff 0%, #232b2b 100%);
      color: #0a192f;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'Orbitron', Arial, sans-serif;
      font-weight: 700;
      box-shadow: 0 2px 12px #00f7ff33;
      transition: background 0.2s, color 0.2s, transform 0.15s;
      outline: none;
    }
    button:hover, button:focus {
      background: linear-gradient(135deg, #00d1ff 0%, #00f7ff 100%);
      color: #081a2b;
      transform: scale(1.07);
    }
    .status {
      margin: 0 auto 18px auto;
      max-width: 420px;
      background: #081a2b;
      border: 2px solid var(--primary);
      border-radius: 12px;
      color: var(--text-fade);
      font-size: 1.08em;
      padding: 10px 18px;
      box-shadow: 0 2px 16px #00f7ff22;
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }
    footer {
      margin-top: auto;
      padding: 1.2rem 0 0.7rem 0;
      color: var(--text-fade);
      font-size: 1em;
      background: none;
      text-align: center;
      letter-spacing: 1px;
    }
    @media (max-width: 600px) {
      .controls {
        max-width: 98vw;
        padding: 10px 2vw 10px 2vw;
        grid-template-columns: repeat(3, 1fr);
      }
      h1 {
        font-size: 1.2rem;
      }
      .status {
        font-size: 0.98em;
        padding: 7px 4vw;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="#" class="logo">
      <img src="https://ucaotech.com/wp-content/uploads/2024/10/UCAO-TECH-1.png" alt="Logo UCAO-TECH" />
      TekBot
    </a>
    <a href="Test3Informatique.html" class="doc-btn" style="margin-left:auto;margin-right:30px;display:flex;align-items:center;gap:7px;padding:8px 18px;background:linear-gradient(135deg,#00f7ff 0%,#00d1ff 100%);color:#081a2b;border-radius:10px;font-family:'Orbitron',Arial,sans-serif;font-weight:700;text-decoration:none;box-shadow:0 2px 12px #00f7ff33;transition:background 0.2s,color 0.2s;">
      <i class="fa-solid fa-book"></i> Documentation
    </a>
  </header>
  <h1>🕹️ Téléopération du robot ROS2</h1>
  <div id="status" class="status"><i class="fa-solid fa-circle-notch fa-spin"></i> Connexion à rosbridge...</div>
  <div class="main-flex">
    <div class="controls-block">
      <div class="controls-title"><i class="fa-solid fa-arrows-alt"></i> Contrôle direction</div>
      <div class="controls">
        <button onclick="move(0.3, 0.3)">↖</button>
        <button onclick="move(0.3, 0)">⬆️</button>
        <button onclick="move(0.3, -0.3)">↗</button>
        <button onclick="move(0, 0.3)">⬅️</button>
        <button onclick="stop()">⏹</button>
        <button onclick="move(0, -0.3)">➡️</button>
        <button onclick="move(-0.3, 0.3)">↙</button>
        <button onclick="move(-0.3, 0)">⬇️</button>
        <button onclick="move(-0.3, -0.3)">↘</button>
      </div>
    </div>
    <div class="video-block">
      <div class="video-title"><i class="fa-solid fa-video"></i> Vue caméra</div>
      <div class="video-card">
        <div class="video-container">
          <img id="camera-view" src="http://localhost:8080/stream?topic=/camera/image_raw" alt="Flux caméra robot" />
          <button id="fullscreen-btn" class="fullscreen-btn" title="Plein écran" onclick="toggleFullscreen()">
            <i class="fa-solid fa-expand"></i>
          </button>
        </div>
      </div>
      <div id="speed-indicator" class="speed-indicator" style="display:none;">
        <i class="fa-solid fa-gauge-high"></i> Vitesse linéaire : <span id="speed-x">0.0</span> &nbsp;|&nbsp; angulaire : <span id="speed-z">0.0</span>
      </div>
      <div class="video-caption">Ce que voit le robot en temps réel</div>
    </div>
  </div>
  <footer>
    Interface TekBot – UCAO-TECH 2025
  </footer>

  <script>
    // Animation visuelle sur bouton clavier
    document.addEventListener('keydown', function(e) {
      if (e.repeat) return;
      let keyBtn;
      switch(e.key) {
        case 'ArrowUp': keyBtn = document.querySelector('.controls button:nth-child(2)'); break;
        case 'ArrowDown': keyBtn = document.querySelector('.controls button:nth-child(8)'); break;
        case 'ArrowLeft': keyBtn = document.querySelector('.controls button:nth-child(4)'); break;
        case 'ArrowRight': keyBtn = document.querySelector('.controls button:nth-child(6)'); break;
        case ' ': keyBtn = document.querySelector('.controls button:nth-child(5)'); break;
      }
      if (keyBtn) keyBtn.classList.add('active-key');
    });
    document.addEventListener('keyup', function(e) {
      let keyBtn;
      switch(e.key) {
        case 'ArrowUp': keyBtn = document.querySelector('.controls button:nth-child(2)'); break;
        case 'ArrowDown': keyBtn = document.querySelector('.controls button:nth-child(8)'); break;
        case 'ArrowLeft': keyBtn = document.querySelector('.controls button:nth-child(4)'); break;
        case 'ArrowRight': keyBtn = document.querySelector('.controls button:nth-child(6)'); break;
        case ' ': keyBtn = document.querySelector('.controls button:nth-child(5)'); break;
      }
      if (keyBtn) keyBtn.classList.remove('active-key');
    });
    // Plein écran vidéo
    function toggleFullscreen() {
      const img = document.getElementById('camera-view');
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        if (img.requestFullscreen) img.requestFullscreen();
        else if (img.webkitRequestFullscreen) img.webkitRequestFullscreen();
        else if (img.msRequestFullscreen) img.msRequestFullscreen();
      }
    }

    // Contrôle clavier
    document.addEventListener('keydown', function(e) {
      if (e.repeat) return;
      switch(e.key) {
        case 'ArrowUp': move(0.3, 0); break;
        case 'ArrowDown': move(-0.3, 0); break;
        case 'ArrowLeft': move(0, 0.3); break;
        case 'ArrowRight': move(0, -0.3); break;
        case ' ': stop(); break;
      }
    });

    // Affichage dynamique vitesse
    function updateSpeed(x, z) {
      document.getElementById('speed-x').textContent = x.toFixed(2);
      document.getElementById('speed-z').textContent = z.toFixed(2);
      document.getElementById('speed-indicator').style.display = (x !== 0 || z !== 0) ? 'flex' : 'none';
    }
    let ros, cmdVel;

    window.onload = function () {
      const status = document.getElementById('status');
      const statusDot = document.createElement('span');
      statusDot.className = 'status-dot';
      status.insertBefore(statusDot, status.firstChild);
      if (typeof ROSLIB === 'undefined') {
        statusDot.classList.add('error');
        status.innerHTML += '<i class="fa-solid fa-triangle-exclamation" style="color:#ff5252"></i> ROSLIB non chargé';
        status.style.color = '#ff5252';
        return;
      }
      ros = new ROSLIB.Ros({ url: 'ws://localhost:9090' });
      ros.on('connection', () => {
        statusDot.className = 'status-dot connected';
        status.innerHTML = '<span class="status-dot connected"></span><i class="fa-solid fa-circle-check" style="color:#00f7ff"></i> Connecté à rosbridge';
        status.style.color = '#00f7ff';
      });
      ros.on('error', (err) => {
        statusDot.className = 'status-dot error';
        status.innerHTML = '<span class="status-dot error"></span><i class="fa-solid fa-triangle-exclamation" style="color:#ff5252"></i> Erreur de connexion à rosbridge';
        status.style.color = '#ff5252';
      });
      ros.on('close', () => {
        statusDot.className = 'status-dot error';
        status.innerHTML = '<span class="status-dot error"></span><i class="fa-solid fa-circle-xmark" style="color:#ff5252"></i> Déconnecté de rosbridge';
        status.style.color = '#ff5252';
      });
      cmdVel = new ROSLIB.Topic({
        ros: ros,
        name: '/cmd_vel',
        messageType: 'geometry_msgs/msg/Twist'
      });
    };

    function move(x, z) {
      const msg = new ROSLIB.Message({
        linear: { x: x, y: 0.0, z: 0.0 },
        angular: { x: 0.0, y: 0.0, z: z }
      });
      cmdVel.publish(msg);
      updateSpeed(x, z);
    }

    function stop() {
      move(0.0, 0.0);
    }
  </script>
</body>
</html>
